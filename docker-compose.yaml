
services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    ports:
      - "8000:8000"

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data

  liteparse:
    image: ghcr.io/run-llama/liteparse-server:main
    ports:
      - "5707:5707"
    restart: unless-stopped


  temporal-init:
    image: temporalio/temporal:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - temporal_data:/data
    restart: "no"

  temporal:
    image: temporalio/temporal:latest
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - "0.0.0.0"
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233" # Temporal gRPC
      - "8233:8233" # Temporal UI
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

  ingest-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest.worker
    command: ["python", "-m", "xrag.jobs.ingest.worker"]
    env_file:
      - .env

    depends_on:
      temporal:
        condition: service_healthy


  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434

    volumes:
      - ollama_data:/root/.ollama

    ports:
      - "11434:11434"

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    # Uncomment if using NVIDIA GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu


  ollama-init:
    image: ollama/ollama:latest
    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL in .env}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        echo "Checking Ollama..."
        ollama list

        echo "Pulling embedding model: $${EMBEDDING_MODEL}"
        ollama pull "$${EMBEDDING_MODEL}"

        echo "Embedding model ready."


  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:
  rustfs_data:
  temporal_data:
  ollama_data:
  qdrant_data:
