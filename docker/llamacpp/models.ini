version = 1

[*]
n-gpu-layers = 99

[chat]
model = /models/chat.gguf
; Context is shared across the two slots: allow 8192 tokens per request.
ctx-size = 16384
parallel = 2
; Reserve generation for the answer instead of an unbounded thinking phase.
chat-template-kwargs = {"enable_thinking": false}

[embedding]
model = /models/embedding.gguf
embedding = true
pooling = mean
; Embedding inputs must fit in one physical batch. Allow tokenizer headroom
; above the ingestion splitter's 512-token chunks.
batch-size = 2048
ubatch-size = 2048

[reranker]
model = /models/reranker.gguf
embedding = true
pooling = rank
reranking = true
batch-size = 2048
ubatch-size = 2048
